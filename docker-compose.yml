services:
  myqqbot:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_DEFAULT_TIMEOUT: 120
        PIP_RETRIES: 10
    container_name: myqqbot
    ports:
      - "8081:8081"
      - "10010:10010"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
