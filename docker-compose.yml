services:
  myqqbot:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_DEFAULT_TIMEOUT: 120
        PIP_RETRIES: 10
    container_name: myqqbot
    ports:
      - "8081:8081"
      - "10010:10010"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYQQBOT_PUBLIC_BASE_URL=${MYQQBOT_PUBLIC_BASE_URL:-http://127.0.0.1:8081}
      - JM_CLEANUP_DELAY_SECONDS=${JM_CLEANUP_DELAY_SECONDS:-300}
      - PIXIV_CLEANUP_DELAY_SECONDS=${PIXIV_CLEANUP_DELAY_SECONDS:-300}
      - PIXIV_PROXY=${PIXIV_PROXY:-socks5h://host.docker.internal:20170}
