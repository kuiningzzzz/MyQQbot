services:
  myqqbot:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_DEFAULT_TIMEOUT: 120
        PIP_RETRIES: 10
    container_name: myqqbot
    ports:
      # 8081 仅宿主机回环可达：NapCat 在宿主机上连接 127.0.0.1:8081，无需对外暴露。
      - "127.0.0.1:8081:8081"
      # 管理界面不再直接发布到公网；由宿主机 nginx(HTTPS:10010) 反代到本回环端口。
      - "127.0.0.1:10012:10010"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DASHSCOPE_HTTP_BASE_URL=${DASHSCOPE_HTTP_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      - AI_AUDIO_MODEL=${AI_AUDIO_MODEL:-qwen3.8-omni-flash}
      - AI_TTS_MODEL=${AI_TTS_MODEL:-qwen-audio-3.0-tts-plus}
      - AI_TTS_VOICE=${AI_TTS_VOICE:-longanlingxin}
      - AI_TTS_INSTRUCTION=${AI_TTS_INSTRUCTION:-用自然亲近的语气说话，像日常聊天，避免播音腔和夸张表演。}
      - AI_AUDIO_ENABLED=${AI_AUDIO_ENABLED:-}
      - AI_VOICE_ENABLED=${AI_VOICE_ENABLED:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.deepseek.com}
      - AI_DSH_API_URL=${AI_DSH_API_URL:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - DEEPSEEK_SEARCH_BASE_URL=${DEEPSEEK_SEARCH_BASE_URL:-https://api.deepseek.com/anthropic/v1}
      - TZ=Asia/Shanghai
      # huggingface.co 在大陆网络不可达；统一走镜像，embedding 模型预下载缓存于 data/ai/.vector_cache。
      - HF_ENDPOINT=https://hf-mirror.com
      - MYQQBOT_PUBLIC_BASE_URL=${MYQQBOT_PUBLIC_BASE_URL:-http://127.0.0.1:8081}
      - JM_CLEANUP_DELAY_SECONDS=${JM_CLEANUP_DELAY_SECONDS:-300}
      - PIXIV_CLEANUP_DELAY_SECONDS=${PIXIV_CLEANUP_DELAY_SECONDS:-300}
      - PIXIV_PROXY=${PIXIV_PROXY:-socks5h://host.docker.internal:20170}
