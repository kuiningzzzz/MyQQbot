- insert:
    - { id: timer, name: '@deepseek-ai/cordis-plugin-timer' }
    - { id: llm, name: '@deepseek-ai/dsh-llm' }
    - id: model
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
    - { id: session, name: '@deepseek-ai/dsh-session' }
    - { id: projection, name: '@deepseek-ai/dsh-session-projection' }
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config: { includeHarnessIdentity: false, includeRuntimeContext: false }
    - { id: tools, name: '@deepseek-ai/dsh-tools' }
    - { id: agent, name: '@deepseek-ai/dsh-agent' }
    - { id: subagents, name: '@deepseek-ai/dsh-subagent' }
    - { id: spawn, name: '@deepseek-ai/dsh-subagent-spawn-in-process' }
    - { id: fork, name: '@deepseek-ai/dsh-subagent-fork-in-process' }
    - id: loop
      name: '@deepseek-ai/dsh-agent-loop'
      config: { agents: [] }
    - { id: meter, name: '@deepseek-ai/dsh-token-meter' }
    - id: compaction
      name: '@deepseek-ai/dsh-compaction-basic'
    - { id: web, name: '@deepseek-ai/dsh-web' }
    - id: web-search
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config: { apiKeyEnv: DEEPSEEK_API_KEY, model: deepseek-flash }
    - { id: web-fetch, name: '@deepseek-ai/dsh-web-fetch-http' }
    - { id: web-tools, name: '@deepseek-ai/dsh-tool-web' }
    - { id: tool-timeout, name: '@deepseek-ai/dsh-tool-call-timeout-policy' }
    - { id: fs, name: '@deepseek-ai/dsh-fs-local' }
    - { id: fs-policy, name: '@deepseek-ai/dsh-fs-observation-policy' }
    - { id: fs-tools, name: '@deepseek-ai/dsh-tool-fs' }
    - { id: subprocess, name: '@deepseek-ai/dsh-subprocess-local' }
    - id: search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config: { sampleOverCapGlobResults: false }
    - { id: shell-env, name: '@deepseek-ai/dsh-shell-env' }
    - id: bash
      name: '@deepseek-ai/dsh-bash-local'
      disabled: !!js process.platform === 'win32'
      config: { timeoutMs: 60000 }
    - id: pwsh
      name: '@deepseek-ai/dsh-pwsh-local'
      disabled: !!js process.platform !== 'win32'
      config: { timeoutMs: 60000 }
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - { id: skills, name: '@deepseek-ai/dsh-skill' }
    - id: skills-files
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        watchFollowSymlinks: false
        customSkillDirs: !!js "[process.env.QQBOT_WORKSPACE + '/.agents/skills']"
    - { id: tool-skill, name: '@deepseek-ai/dsh-tool-skill' }
    - id: qqbot
      name: ./plugin.mjs
      inject: [agents, sessions, agentLoop, tools, systemPrompt, sessionPersistence, fs, compaction, subagents]
