- insert:
    - { id: timer, name: '@deepseek-ai/cordis-plugin-timer' }
    - { id: llm, name: '@deepseek-ai/dsh-llm' }
    - id: model
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
        thinking: !!js process.env.QQBOT_THINKING
        reasoningEffort: !!js process.env.QQBOT_REASONING
        defaultContextWindow: !!js Number(process.env.QQBOT_CONTEXT)
        models: !!js "[{id: process.env.QQBOT_MODEL, contextWindow: Number(process.env.QQBOT_CONTEXT), maxTokens: Number(process.env.QQBOT_MAX_TOKENS)}]"
        streamIdleTimeoutMs: 120000
    - { id: session, name: '@deepseek-ai/dsh-session' }
    - { id: projection, name: '@deepseek-ai/dsh-session-projection' }
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config: { includeHarnessIdentity: false, includeRuntimeContext: false }
    - { id: tools, name: '@deepseek-ai/dsh-tools' }
    - { id: agent, name: '@deepseek-ai/dsh-agent' }
    - id: loop
      name: '@deepseek-ai/dsh-agent-loop'
      config: { agents: [] }
    - { id: meter, name: '@deepseek-ai/dsh-token-meter' }
    - id: compaction
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: !!js Number(process.env.QQBOT_COMPRESSION)
        headroomTokens: 2048
        maxTokens: !!js Math.min(4096, Math.floor(Number(process.env.QQBOT_CONTEXT) / 4))
        retainRatio: !!js Math.min(0.16, Number(process.env.QQBOT_COMPRESSION) / 2)
    - { id: fs, name: '@deepseek-ai/dsh-fs-local' }
    - { id: fs-policy, name: '@deepseek-ai/dsh-fs-observation-policy' }
    - { id: fs-tools, name: '@deepseek-ai/dsh-tool-fs' }
    - { id: subprocess, name: '@deepseek-ai/dsh-subprocess-local' }
    - id: search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config: { sampleOverCapGlobResults: false }
    - { id: shell-env, name: '@deepseek-ai/dsh-shell-env' }
    - id: bash
      name: '@deepseek-ai/dsh-bash-local'
      disabled: !!js process.platform === 'win32'
      config: { timeoutMs: 60000 }
    - id: pwsh
      name: '@deepseek-ai/dsh-pwsh-local'
      disabled: !!js process.platform !== 'win32'
      config: { timeoutMs: 60000 }
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
    - { id: skills, name: '@deepseek-ai/dsh-skill' }
    - id: skills-files
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        watchFollowSymlinks: false
        customSkillDirs: !!js "[process.env.QQBOT_WORKSPACE + '/.agents/skills']"
    - { id: tool-skill, name: '@deepseek-ai/dsh-tool-skill' }
    - id: qqbot
      name: ./plugin.mjs
      inject: [agents, sessions, agentLoop, tools, systemPrompt, sessionPersistence, fs, compaction]
